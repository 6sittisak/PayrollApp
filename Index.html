<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ระบบเงินเดือน</title>
<style>
:root{--brand:#F0060B;--bg:#f6f6f7;--card:#fff;--ink:#1c1c1e;--mut:#6b6b73;--line:#e3e3e8;--ok:#13795b;--warn:#b45309}
@media (prefers-color-scheme:dark){:root{--bg:#141416;--card:#1e1e22;--ink:#f2f2f4;--mut:#a0a0aa;--line:#34343a;--ok:#4cc9a0;--warn:#f0a95a}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 system-ui,"Noto Sans Thai",sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--brand);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px}
header img{height:34px;border-radius:4px;background:#fff;padding:2px}
header b{font-size:17px}
nav{display:flex;gap:4px;overflow-x:auto;padding:8px 12px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
nav a{white-space:nowrap;padding:6px 12px;border-radius:999px;color:var(--ink);text-decoration:none;font-size:14px}
nav a.on{background:var(--brand);color:#fff}
main{max-width:1000px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
h2{margin:0 0 12px;font-size:18px} h3{margin:14px 0 8px;font-size:15px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
label{display:flex;flex-direction:column;font-size:13px;color:var(--mut);gap:3px}
input,select,textarea{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);min-width:0}
button{font:inherit;padding:7px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.pri{background:var(--brand);color:#fff;border-color:var(--brand)}
button.sm{padding:3px 9px;font-size:13px} button:disabled{opacity:.5;cursor:default}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{color:var(--mut);font-weight:600;font-size:13px} td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.wrap{overflow-x:auto}
.badge{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;background:var(--line)}
.badge.ok{color:var(--ok)} .badge.warn{color:var(--warn)}
.msg{padding:9px 12px;border-radius:8px;margin:10px 0;font-size:14px}
.msg.err{background:#fde8e8;color:#9b1c1c} .msg.good{background:#e3f6ee;color:#0d5c44} .msg.info{background:var(--line)}
@media (prefers-color-scheme:dark){.msg.err{background:#4a1d1d;color:#ffb4b4}.msg.good{background:#123d30;color:#9be3c6}}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat div{background:var(--bg);border-radius:10px;padding:10px 12px} .stat b{display:block;font-size:22px}
.slip{max-width:560px;margin:0 auto;border:1px solid var(--line);border-radius:10px;padding:20px;background:#fff;color:#111}
.slip .top{display:flex;gap:12px;align-items:center;border-bottom:3px solid #F0060B;padding-bottom:10px;margin-bottom:12px}
.slip .top img{max-height:56px;max-width:120px}
.slip table td,.slip table th{border-color:#ddd;color:#111}
.slip .net{background:#F0060B;color:#fff;padding:10px 14px;border-radius:8px;display:flex;justify-content:space-between;font-size:18px;font-weight:700;margin-top:12px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.logo-prev{max-height:70px;max-width:200px;border:1px dashed var(--line);padding:4px;border-radius:6px;background:#fff}
.hide{display:none}
@media print{body *{visibility:hidden} #printArea,#printArea *{visibility:visible} #printArea{position:absolute;left:0;top:0;width:100%} .slip{border:none}}
@media (max-width:600px){main{padding:12px}}
</style>
</head>
<body>
<header><img id="hLogo" class="hide" alt=""><b id="hName">ระบบเงินเดือน</b></header>
<nav id="nav"></nav>
<main id="main"></main>

<script>
'use strict';
const PAGES = [
  ['dash','ภาพรวม'],['emp','พนักงาน'],['pos','ตำแหน่งงาน'],['ts','บันทึกเวลา'],['ocr','อัปรูปใบลงเวลา'],
  ['form','พิมพ์ใบลงเวลา'],['adj','ปรับเงิน'],['calc','คำนวณเงินเดือน'],['slips','สลิป'],['set','ตั้งค่าระบบ'],['log','บันทึกกิจกรรม']
];
const S = { settings:{}, positions:[], employees:[], pending:0, ocrReady:false, ready:false };
const $ = (s, el=document) => el.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => Number(n||0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
const hrs = m => (m/60).toFixed(2);
const bd = d => { const p = String(d||'').split('-'); return p.length===3 ? `${+p[2]}/${+p[1]}/${+p[0]+543}` : d||''; };
const pad = n => String(n).padStart(2,'0');
const monthRange = () => { const n=new Date(), y=n.getFullYear(), m=n.getMonth(); return [`${y}-${pad(m+1)}-01`, `${y}-${pad(m+1)}-${pad(new Date(y,m+1,0).getDate())}`]; };
const empName = id => (S.employees.find(e=>e.id===id)||{}).name || id;

// ── เรียกเซิร์ฟเวอร์ผ่านตัวกลาง run() (คืน JSON string) ──
function call(name, ...args){
  return new Promise((resolve, reject) => {
    google.script.run.withSuccessHandler(txt => {
      let r; try { r = JSON.parse(txt); } catch(e){ return reject(new Error('เซิร์ฟเวอร์ตอบกลับผิดรูปแบบ')); }
      r.ok ? resolve(r.data) : reject(new Error(r.error));
    }).withFailureHandler(e => reject(new Error(e && e.message || 'เรียกเซิร์ฟเวอร์ไม่สำเร็จ'))).run(name, JSON.stringify(args));
  });
}
function note(el, text, kind='info'){ let m=$('.msg',el); if(!m){ m=document.createElement('div'); el.prepend(m);} m.className='msg '+kind; m.textContent=text; }
async function act(btn, host, fn, okText){
  const old = btn && btn.textContent; if(btn){ btn.disabled=true; btn.textContent='กำลังทำงาน…'; }
  try{ const r = await fn(); if(okText) note(host, okText, 'good'); return r; }
  catch(e){ note(host, e.message, 'err'); }
  finally{ if(btn){ btn.disabled=false; btn.textContent=old; } }
}
const posOpts = sel => `<option value="">— เลือก —</option>` + S.positions.map(p=>`<option value="${esc(p.id)}"${p.id===sel?' selected':''}>${esc(p.name)} (${money(p.rate)}/ชม.)</option>`).join('');
const empOpts = (sel, all) => (all?`<option value="">ทุกคน</option>`:`<option value="">— เลือกพนักงาน —</option>`) + S.employees.filter(e=>e.status==='active'||e.id===sel).map(e=>`<option value="${esc(e.id)}"${e.id===sel?' selected':''}>${esc(e.id)} ${esc(e.name)}</option>`).join('');

function applyBoot(d){
  Object.assign(S, d, {ready:true});
  const s = S.settings;
  $('#hName').textContent = s.company_name_th || 'ระบบเงินเดือน';
  const img = $('#hLogo'); if(s.logo){ img.src=s.logo; img.classList.remove('hide'); } else img.classList.add('hide');
}
function companyHead(){ const s=S.settings; return `${esc(s.company_name_th)}${s.company_name_en?`<br><small>${esc(s.company_name_en)}</small>`:''}`; }

// ── หน้าต่างๆ ──
const V = {};

V.dash = async el => {
  const [f,t] = monthRange();
  el.innerHTML = `<div class="card"><h2>ภาพรวม</h2><div class="stat" id="st"></div><div id="hint"></div></div>`;
  const slips = await call('apiListSlips', f, t);
  $('#st').innerHTML = `<div><b>${S.employees.filter(e=>e.status==='active').length}</b>พนักงานที่ทำงานอยู่</div>
    <div><b>${S.pending}</b>ใบลงเวลารออนุมัติ</div><div><b>${slips.length}</b>สลิปเดือนนี้</div>
    <div><b>${money(slips.reduce((s,x)=>s+x.net,0))}</b>เงินสุทธิรวมที่ออกสลิปแล้ว</div>`;
  const hints = [];
  if(!S.settings.company_name_th) hints.push('ยังไม่ได้ตั้งชื่อบริษัท → ไปเมนู "ตั้งค่าระบบ"');
  if(!S.positions.length) hints.push('ยังไม่มีตำแหน่งงาน → เพิ่มค่าแรงต่อชั่วโมงที่เมนู "ตำแหน่งงาน"');
  if(!S.employees.length) hints.push('ยังไม่มีพนักงาน → เพิ่มที่เมนู "พนักงาน"');
  if(hints.length) $('#hint').innerHTML = hints.map(h=>`<div class="msg info">${esc(h)}</div>`).join('');
};

V.pos = el => {
  const draw = () => {
    el.innerHTML = `<div class="card"><h2>ตำแหน่งงาน (ค่าแรงต่อชั่วโมง)</h2>
      <div class="row"><label>ชื่อตำแหน่ง<input id="pn"></label><label>ค่าแรง/ชม. (บาท)<input id="pr" inputmode="decimal" style="width:130px"></label>
      <input type="hidden" id="pid"><button class="pri" id="ps">บันทึก</button><button id="pc" class="hide">ยกเลิกแก้ไข</button></div>
      <div class="wrap"><table><tr><th>ตำแหน่ง</th><th class="n">ค่าแรง/ชม.</th><th></th></tr>
      ${S.positions.map(p=>`<tr><td>${esc(p.name)}</td><td class="n">${money(p.rate)}</td><td><button class="sm" data-e="${esc(p.id)}">แก้ไข</button> <button class="sm" data-d="${esc(p.id)}">ลบ</button></td></tr>`).join('')||'<tr><td colspan=3>ยังไม่มีตำแหน่ง</td></tr>'}</table></div></div>`;
    $('#ps').onclick = e => act(e.target, el, async()=>{ S.positions = await call('apiSavePosition',{id:$('#pid').value||undefined,name:$('#pn').value,rate:$('#pr').value}); draw(); note(el,'บันทึกแล้ว','good'); });
    el.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{ const p=S.positions.find(x=>x.id===b.dataset.e); $('#pid').value=p.id; $('#pn').value=p.name; $('#pr').value=p.rate; $('#pc').classList.remove('hide'); });
    $('#pc').onclick = draw;
    el.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{ if(confirm('ลบตำแหน่งนี้?')) act(b, el, async()=>{ S.positions = await call('apiDeletePosition', b.dataset.d); draw(); }); });
  };
  draw();
};

V.emp = el => {
  let edit = null;
  const draw = () => {
    const e = edit || {};
    el.innerHTML = `<div class="card"><h2>${edit?'แก้ไขพนักงาน '+esc(e.id):'เพิ่มพนักงาน'}</h2>
      <div class="row"><label>รหัสพนักงาน<input id="ei" value="${esc(e.id)}" ${edit?'readonly':''} style="width:120px"></label>
      <label>ชื่อ-สกุล<input id="en" value="${esc(e.name)}"></label>
      <label>ตำแหน่ง<select id="ep">${posOpts(e.position_id)}</select></label>
      <label>ค่าแรงเฉพาะบุคคล (ถ้ามี)<input id="eo" inputmode="decimal" value="${esc(e.rate_override)}" style="width:130px"></label></div>
      <div class="row" style="margin-top:8px"><label>เบอร์โทร<input id="eph" value="${esc(e.phone)}"></label>
      <label>เลขบัญชี<input id="eb" value="${esc(e.bank_account)}"></label>
      <label>LINE user id (สำหรับบอท)<input id="el" value="${esc(e.line_user_id)}"></label>
      <button class="pri" id="es">บันทึก</button>${edit?'<button id="ec">ยกเลิก</button>':''}</div></div>
      <div class="card"><h2>รายชื่อพนักงาน</h2><div class="wrap"><table><tr><th>รหัส</th><th>ชื่อ</th><th>ตำแหน่ง</th><th class="n">ค่าแรง/ชม.</th><th>สถานะ</th><th></th></tr>
      ${S.employees.map(x=>{const p=S.positions.find(q=>q.id===x.position_id);const r=x.rate_override!==''?x.rate_override:(p?p.rate:0);
        return `<tr><td>${esc(x.id)}</td><td>${esc(x.name)}</td><td>${esc(p?p.name:'-')}</td><td class="n">${money(r)}</td>
        <td><span class="badge ${x.status==='active'?'ok':'warn'}">${x.status==='active'?'ทำงานอยู่':'ปิดใช้งาน'}</span></td>
        <td><button class="sm" data-e="${esc(x.id)}">แก้ไข</button> <button class="sm" data-t="${esc(x.id)}">${x.status==='active'?'ปิดใช้งาน':'เปิดใช้งาน'}</button></td></tr>`;}).join('')||'<tr><td colspan=6>ยังไม่มีพนักงาน</td></tr>'}</table></div></div>`;
    $('#es').onclick = ev => act(ev.target, el, async()=>{
      S.employees = await call('apiSaveEmployee',{isNew:!edit,id:$('#ei').value,name:$('#en').value,position_id:$('#ep').value,rate_override:$('#eo').value,phone:$('#eph').value,bank_account:$('#eb').value,line_user_id:$('#el').value,status:e.status||'active'});
      edit=null; draw(); note(el,'บันทึกแล้ว','good'); });
    if(edit) $('#ec').onclick = ()=>{ edit=null; draw(); };
    el.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{ edit=S.employees.find(x=>x.id===b.dataset.e); draw(); window.scrollTo(0,0); });
    el.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>act(b, el, async()=>{ S.employees = await call('apiDeactivateEmployee', b.dataset.t); draw(); }));
  };
  draw();
};

V.ts = el => {
  const [f,t] = monthRange(); let rows = [];
  el.innerHTML = `<div class="card"><h2>บันทึกเวลา</h2>
    <div class="row"><label>พนักงาน<select id="te">${empOpts('')}</select></label><label>วันที่<input type="date" id="td"></label>
    <label>เข้า<input type="time" id="ti" value="09:00"></label><label>ออก<input type="time" id="to" value="18:00"></label>
    <label>พัก (นาที)<input id="tb" inputmode="numeric" placeholder="ว่าง = ค่าตั้งต้น" style="width:120px"></label>
    <label>หมายเหตุ<input id="tn"></label><button class="pri" id="tadd">บันทึก</button></div>
    <p style="color:var(--mut);font-size:13px;margin:8px 0 0">เวลาพักว่างหรือ 0 = หักพักตามค่าตั้งต้น · ครึ่งวันไม่พัก ให้กรอกเวลาออกให้ตรงชั่วโมงที่ทำจริง · กะข้ามเที่ยงคืนยังไม่รองรับ</p></div>
    <div class="card"><div class="row"><label>จาก<input type="date" id="tf" value="${f}"></label><label>ถึง<input type="date" id="tt" value="${t}"></label>
    <label>พนักงาน<select id="tq">${empOpts('',true)}</select></label><button id="tl">แสดง</button><button id="tapp">อนุมัติทั้งหมดที่รอ</button></div>
    <div class="wrap" id="tbl"></div></div>`;
  const load = async () => {
    rows = await call('apiListTimesheets', $('#tf').value, $('#tt').value, $('#tq').value);
    $('#tbl').innerHTML = `<table><tr><th>วันที่</th><th>พนักงาน</th><th>เข้า</th><th>ออก</th><th class="n">พัก</th><th>หมายเหตุ</th><th>สถานะ</th><th></th></tr>
      ${rows.map(r=>`<tr><td>${bd(r.date)}</td><td>${esc(empName(r.emp_id))}</td><td>${esc(r.time_in)}</td><td>${esc(r.time_out)}</td><td class="n">${esc(r.break_min)}</td><td>${esc(r.note)}</td>
      <td><span class="badge ${r.status==='approved'?'ok':'warn'}">${r.status==='approved'?'อนุมัติ':'รอตรวจ'}</span></td>
      <td><button class="sm" data-s="${r.id}" data-v="${r.status==='approved'?'pending':'approved'}">${r.status==='approved'?'ยกเลิกอนุมัติ':'อนุมัติ'}</button> <button class="sm" data-x="${r.id}">ลบ</button></td></tr>`).join('')||'<tr><td colspan=8>ไม่มีข้อมูลในช่วงนี้</td></tr>'}</table>`;
    el.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>act(b, el, async()=>{ await call('apiSetStatus',[b.dataset.s],b.dataset.v); await refreshPending(); await load(); }));
    el.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{ if(confirm('ลบแถวนี้?')) act(b, el, async()=>{ await call('apiDeleteTimesheets',[b.dataset.x]); await refreshPending(); await load(); }); });
  };
  $('#tl').onclick = e => act(e.target, el, load);
  $('#tapp').onclick = e => act(e.target, el, async()=>{ const ids=rows.filter(r=>r.status!=='approved').map(r=>r.id); if(!ids.length) throw new Error('ไม่มีแถวที่รออนุมัติ'); await call('apiSetStatus',ids,'approved'); await refreshPending(); await load(); note(el,`อนุมัติ ${ids.length} แถว`,'good'); });
  $('#tadd').onclick = e => act(e.target, el, async()=>{
    await call('apiSaveTimesheets',[{emp_id:$('#te').value,date:$('#td').value,time_in:$('#ti').value,time_out:$('#to').value,break_min:$('#tb').value,note:$('#tn').value,status:'approved'}]);
    await refreshPending(); await load(); note(el,'บันทึกแล้ว (อนุมัติอัตโนมัติเพราะกรอกเอง)','good'); });
  load().catch(e=>note(el,e.message,'err'));
};
async function refreshPending(){ const d = await call('apiBootstrap'); applyBoot(d); }

V.ocr = el => {
  el.innerHTML = `<div class="card"><h2>อัปรูปใบลงเวลา (AI อ่าน)</h2>
    ${S.ocrReady?'':'<div class="msg info">ยังไม่ได้ตั้ง GEMINI_API_KEY — ตั้งใน Script Properties แล้วกด "ทดสอบคีย์ AI" ที่เมนูตั้งค่า หรือกรอกเวลาเองที่เมนูบันทึกเวลา</div>'}
    <div class="row"><label>พนักงาน<select id="oe">${empOpts('')}</select></label><label>รูปใบลงเวลา<input type="file" id="of" accept="image/*"></label>
    <button class="pri" id="ogo" ${S.ocrReady?'':'disabled'}>ให้ AI อ่าน</button></div>
    <p style="color:var(--mut);font-size:13px">AI อ่านผิดได้ ตรวจทุกแถวก่อนบันทึก — ที่บันทึกจากหน้านี้จะอยู่สถานะ "รอตรวจ" จนกว่าจะอนุมัติ</p><div id="ores"></div></div>`;
  $('#ogo').onclick = e => act(e.target, el, async()=>{
    if(!$('#oe').value) throw new Error('เลือกพนักงานก่อน'); const f=$('#of').files[0]; if(!f) throw new Error('เลือกรูปก่อน');
    const url = await shrink(f, 1600, 'image/jpeg', .85);
    const r = await call('apiOcr', url);
    $('#ores').innerHTML = `<div class="msg good">อ่านได้ ${r.rows.length} แถว${r.skipped?` · ข้ามแถวที่อ่านไม่ออก ${r.skipped}`:''} (${esc(r.model)})</div>
      <div class="wrap"><table id="otb"><tr><th></th><th>วันที่</th><th>เข้า</th><th>ออก</th><th>พัก</th><th>หมายเหตุ</th></tr>
      ${r.rows.map(x=>`<tr><td><input type="checkbox" checked></td><td><input type="date" value="${esc(x.date)}"></td><td><input type="time" value="${esc(x.time_in)}"></td><td><input type="time" value="${esc(x.time_out)}"></td><td><input value="${esc(x.break_min)}" style="width:60px"></td><td><input value="${esc(x.note)}"></td></tr>`).join('')}</table></div>
      <button class="pri" id="osave" style="margin-top:10px">บันทึกแถวที่ติ๊กไว้</button>`;
    $('#osave').onclick = ev => act(ev.target, el, async()=>{
      const list=[...document.querySelectorAll('#otb tr')].slice(1).filter(tr=>tr.querySelector('input[type=checkbox]').checked).map(tr=>{const i=tr.querySelectorAll('input');return {emp_id:$('#oe').value,date:i[1].value,time_in:i[2].value,time_out:i[3].value,break_min:i[4].value,note:i[5].value,status:'pending'};});
      if(!list.length) throw new Error('ไม่ได้เลือกแถว'); const n=await call('apiSaveTimesheets',list); await refreshPending(); note(el,`บันทึก ${n} แถว (รอตรวจที่เมนูบันทึกเวลา)`,'good'); });
  });
};
function shrink(file, max, type, q){
  return new Promise((res, rej) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => { const k=Math.min(1,max/Math.max(img.width,img.height)), c=document.createElement('canvas'); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
      const g=c.getContext('2d'); if(type==='image/jpeg'){ g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height);} g.drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(u); res(c.toDataURL(type,q)); };
    img.onerror = () => rej(new Error('เปิดรูปไม่ได้')); img.src = u;
  });
}

// ── ระบบนำทาง ──
async function go(){
  const id = (location.hash||'#dash').slice(1); const page = V[id] ? id : 'dash';
  $('#nav').innerHTML = PAGES.map(([k,l])=>`<a href="#${k}" class="${k===page?'on':''}">${l}</a>`).join('');
  const main = $('#main'); main.innerHTML = '<div class="card">กำลังโหลด…</div>';
  try{
    if(!S.ready) applyBoot(await call('apiBootstrap'));
    if(!S.settings.company_name_th && !location.hash && !sessionStorage_get('seenSet')){ sessionStorage_set('seenSet','1'); location.hash = '#set'; return; }
    main.innerHTML = ''; await V[page](main);
  }catch(e){ main.innerHTML = `<div class="msg err">${esc(e.message)}</div>`; }
}
function sessionStorage_get(k){ try{ return sessionStorage.getItem(k); }catch(e){ return null; } }
function sessionStorage_set(k,v){ try{ sessionStorage.setItem(k,v); }catch(e){} }
window.addEventListener('hashchange', go);
go();
</script>
